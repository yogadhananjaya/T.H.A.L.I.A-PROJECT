<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="T.H.A.L.I.A Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D13"/>
      <stop offset="55%" stop-color="#0D131D"/>
      <stop offset="100%" stop-color="#0A1018"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="26%" cy="52%" r="34%">
      <stop offset="0%" stop-color="#50B868" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#50B868" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="30%" cy="68%" r="30%">
      <stop offset="0%" stop-color="#60C0E8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#60C0E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#50B868"/>
      <stop offset="100%" stop-color="#60C0E8"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60C0E8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="520" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base dark canvas -->
    <rect x="0" y="0" width="1200" height="520" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1200" height="520" fill="url(#glowGreen)"/>
    <rect x="0" y="0" width="1200" height="520" fill="url(#glowCyan)"/>

    <!-- Subtle grid lines on left -->
    <g stroke="#1E293B" stroke-opacity="0.35" stroke-width="1">
      <line x1="560" y1="24" x2="560" y2="496" stroke-dasharray="4 6"/>
    </g>

    <!-- Terminal path header -->
    <text x="36" y="42" fill="#48566A" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">~/t.h.a.l.i.a/v1.0</text>

    <!-- Background telemetry matrix (left side, subtle atmospheric texture) -->
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#2A384A" opacity="0.72">
      <text x="36" y="92">POST /api/v1/telemetry HTTP/1.1  node_id="ESP32-NODE-01"  interval=10s</text>
      <text x="36" y="114">{"temperature_c": 23.56, "humidity_pct": 51.1, "pressure_hpa": 1012.6,</text>
      <text x="36" y="136"> "rainfall_pct": 0.0, "is_raining": false, "rainfall_raw": 4095,</text>
      <text x="36" y="158"> "soil_moisture_pct": 79.3, "soil_raw": 629}  -&gt;  200 OK</text>
      <text x="36" y="186">bmkg_region="32.16.19.2001"  lat=-6.3378  lon=107.1541  Cibatu, Bekasi</text>
      <text x="36" y="208">rule_engine.evaluate(atmo=BME280, hydro=FC37, litho=SOIL_V12)</text>
      <text x="36" y="230">if soil &gt;= 80.0 and rain &gt;= 30.0: severity = "DANGER"  # Multi-Habitat</text>
      <text x="36" y="252">elif soil &gt;= 65.0 or rain &gt;= 30.0: severity = "ALERT"  # Cooldown 60s</text>
      <text x="36" y="280">sha256_hash = hashlib.sha256(canonical_snapshot).hexdigest()</text>
      <text x="36" y="302">THALIARegistry.recordAlert(alertId, nodeId, severity, dataHash)</text>
      <text x="36" y="324">GET /api/v1/alerts/{id}/verify  -&gt;  {"verified": true, "checks": 4/4}</text>
      <text x="36" y="346">fcm_service.broadcast(topic="thalia_alerts") + polling_fallback=ON</text>
      <text x="36" y="374">GET /api/v1/forecast?radius_km=5  -&gt;  day0=ESP32_LIVE, day1..4=BMKG</text>
      <text x="36" y="396">GET /api/v1/comparison  -&gt;  hyper_local_delta vs regional_macro_feed</text>
      <text x="36" y="418">status="OPERATIONAL"  adc1=[GPIO34,GPIO35]  i2c=0x76  wifi=2.4GHz</text>
      <text x="36" y="440">tx_receipt="0x7f9a...c41e"  immutable_audit=VERIFIED  tamper=0</text>
    </g>

    <!-- Radar pulse rings around left emblem -->
    <g fill="none" stroke-dasharray="5 6">
      <circle cx="290" cy="264" r="158" stroke="#60C0E8" stroke-opacity="0.22" stroke-width="1.2"/>
      <circle cx="290" cy="264" r="118" stroke="#50B868" stroke-opacity="0.30" stroke-width="1.2"/>
      <circle cx="290" cy="264" r="78" stroke="#60C0E8" stroke-opacity="0.24" stroke-width="1"/>
    </g>

    <!-- Stylized T.H.A.L.I.A Shield + Lightning + Wave Vector Emblem (Left Center) -->
    <g transform="translate(290, 260)" filter="url(#softGlow)">
      <!-- Dark inner shield backdrop -->
      <path d="M 0 -106 L 86 -72 L 86 -6 C 86 52 48 94 0 112 C -48 94 -86 52 -86 -6 L -86 -72 Z"
            fill="#0D1520" fill-opacity="0.92" stroke="url(#brandGrad)" stroke-width="5" stroke-linejoin="round"/>
      <!-- Lightning bolt (Atmosphere / Energy) -->
      <path d="M 10 -86 L -34 6 L 2 6 L -14 68 L 40 -20 L 2 -20 Z"
            fill="#50B868"/>
      <!-- Wave crest (Hydrosphere) -->
      <path d="M -64 42 C -34 22, 6 62, 64 38 C 46 72, 24 92, 0 102 C -26 92, -50 70, -64 42 Z"
            fill="url(#waveGrad)" opacity="0.95"/>
      <path d="M -56 54 C -24 38, 12 72, 54 54" fill="none" stroke="#0D1520" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Small live sensor pills below emblem -->
    <g transform="translate(96, 456)" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <rect x="0" y="0" width="118" height="26" rx="13" fill="#111C28" stroke="#50B868" stroke-opacity="0.5"/>
      <circle cx="16" cy="13" r="3.5" fill="#50B868"/>
      <text x="27" y="17" fill="#C9D1D9">Atmosphere</text>

      <rect x="130" y="0" width="122" height="26" rx="13" fill="#111C28" stroke="#60C0E8" stroke-opacity="0.5"/>
      <circle cx="146" cy="13" r="3.5" fill="#60C0E8"/>
      <text x="157" y="17" fill="#C9D1D9">Hydrosphere</text>

      <rect x="264" y="0" width="122" height="26" rx="13" fill="#111C28" stroke="#F0B429" stroke-opacity="0.5"/>
      <circle cx="280" cy="13" r="3.5" fill="#F0B429"/>
      <text x="291" y="17" fill="#C9D1D9">Lithosphere</text>
    </g>

    <!-- RIGHT SIDE: Hero Typography & Real KPIs -->
    <g transform="translate(602, 86)">
      <!-- Eyebrow status pill -->
      <circle cx="6" cy="-4" r="4" fill="#50B868"/>
      <text x="18" y="0" fill="#8B949E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8">HACKSPHERE 2026 · WEB3 INNOVATION</text>

      <!-- Title -->
      <text x="0" y="72" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1">T.H.A.L.I.A</text>
      <text x="360" y="72" fill="url(#brandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700">v1.0</text>

      <!-- Tagline -->
      <text x="2" y="112" fill="#9BA7B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400">Tri-Habitat Analysis &amp; Climate Forecasting Intelligence.</text>

      <!-- 4 Real Metric Columns -->
      <g transform="translate(0, 174)">
        <text x="0" y="0" fill="#50B868" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700">3</text>
        <text x="0" y="22" fill="#7D8590" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">habitats</text>

        <text x="128" y="0" fill="#60C0E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700">10s</text>
        <text x="128" y="22" fill="#7D8590" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">live telemetry</text>

        <text x="272" y="0" fill="#A371F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700">4-Layer</text>
        <text x="272" y="22" fill="#7D8590" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">web3 audit</text>

        <text x="430" y="0" fill="#F0B429" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700">BMKG</text>
        <text x="430" y="22" fill="#7D8590" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">macro compare</text>
      </g>

      <!-- Divider -->
      <line x1="0" y1="226" x2="540" y2="226" stroke="#21262D" stroke-width="1"/>

      <!-- Bottom callout -->
      <text x="0" y="268" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-style="italic">End-to-end</text>
      <text x="98" y="270" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700">IoT → API → Solidity → Mobile</text>
      <text x="0" y="302" fill="#9BA7B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">Hyper-local early warning verified with SHA-256 on-chain audit trail.</text>
      <text x="0" y="324" fill="#6E7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Real ESP32 sensors + FastAPI + Hardhat THALIARegistry + Flutter Hybrid Push.</text>

      <!-- Footnote -->
      <text x="0" y="388" fill="#48566A" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">Team Ayam Kecap Paijo · ASTRA Polytechnic · COMPSPHERE 2026</text>
    </g>
  </g>

  <!-- Crisp outer border -->
  <rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="none" stroke="#21262D" stroke-width="1"/>
</svg>
