<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="T.H.A.L.I.A ESP32 Tri-Habitat Hardware Wiring Wireframe">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#16202C" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Dark blueprint background -->
  <rect x="0.5" y="0.5" width="1199" height="539" rx="14" fill="#0A0F16" stroke="#21262D" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="538" rx="14" fill="url(#grid)" opacity="0.8"/>

  <!-- Header -->
  <text x="36" y="40" fill="#7D8590" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">HARDWARE WIREFRAME · ESP32-NODE-01 (TRI-HABITAT)</text>
  <text x="1164" y="40" text-anchor="end" fill="#50B868" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">ADC1-ONLY ANALOG · WI-FI 2.4 GHZ SAFE</text>

  <!-- ==================== CENTER: ESP32 DEVKIT BOARD ==================== -->
  <g transform="translate(465, 86)">
    <!-- PCB outline -->
    <rect x="0" y="0" width="270" height="368" rx="14" fill="#111A24" stroke="#60C0E8" stroke-width="2"/>
    <!-- RF Shield can -->
    <rect x="52" y="24" width="166" height="114" rx="8" fill="#182330" stroke="#48566A" stroke-width="1.5"/>
    <text x="135" y="68" text-anchor="middle" fill="#E6EDF3" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">ESP-WROOM-32</text>
    <text x="135" y="90" text-anchor="middle" fill="#8B949E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">ESP32-D0WD-V3</text>
    <text x="135" y="108" text-anchor="middle" fill="#50B868" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">MicroPython v1.29.0</text>

    <!-- On-board LED indicator -->
    <circle cx="212" cy="176" r="6" fill="#60C0E8" fill-opacity="0.25" stroke="#60C0E8" stroke-width="1.4"/>
    <circle cx="212" cy="176" r="2.5" fill="#60C0E8"/>
    <text x="198" y="180" text-anchor="end" fill="#8B949E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">LED (GPIO 2)</text>

    <!-- Left Header Pins -->
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      <circle cx="14" cy="166" r="5" fill="#F85149"/>
      <text x="28" y="170" fill="#F85149" font-weight="700">VIN (5V)</text>

      <circle cx="14" cy="206" r="5" fill="#F0B429"/>
      <text x="28" y="210" fill="#F0B429" font-weight="700">3V3</text>

      <circle cx="14" cy="246" r="5" fill="#8B949E"/>
      <text x="28" y="250" fill="#C9D1D9">GND</text>

      <circle cx="14" cy="286" r="5" fill="#50B868"/>
      <text x="28" y="290" fill="#50B868" font-weight="700">P34 (ADC1)</text>

      <circle cx="14" cy="326" r="5" fill="#60C0E8"/>
      <text x="28" y="330" fill="#60C0E8" font-weight="700">P35 (ADC1)</text>
    </g>

    <!-- Right Header Pins -->
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" text-anchor="end">
      <circle cx="256" cy="206" r="5" fill="#50B868"/>
      <text x="242" y="210" fill="#50B868" font-weight="700">P21 (SDA)</text>

      <circle cx="256" cy="246" r="5" fill="#A371F7"/>
      <text x="242" y="250" fill="#A371F7" font-weight="700">P22 (SCL)</text>

      <circle cx="256" cy="286" r="5" fill="#60C0E8"/>
      <text x="242" y="290" fill="#60C0E8" font-weight="700">P23 (DO)</text>

      <circle cx="256" cy="326" r="5" fill="#F0B429"/>
      <text x="242" y="330" fill="#F0B429">3V3 / GND</text>
    </g>

    <!-- Micro-USB / Power Port -->
    <rect x="98" y="348" width="74" height="20" rx="4" fill="#21262D" stroke="#6E7681" stroke-width="1.2"/>
    <text x="135" y="362" text-anchor="middle" fill="#8B949E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">USB 5V 2A</text>
  </g>

  <!-- ==================== LEFT MODULE: CAPACITIVE SOIL MOISTURE v1.2 ==================== -->
  <g transform="translate(46, 134)">
    <rect x="0" y="0" width="318" height="232" rx="12" fill="#101820" stroke="#50B868" stroke-width="1.6"/>
    <text x="20" y="32" fill="#50B868" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">LITHOSPHERE</text>
    <text x="20" y="56" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Capacitive Soil v1.2</text>
    <text x="20" y="78" fill="#8B949E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">On-board 3.3V LDO (U2) → Use VIN 5V</text>

    <!-- Stylized probe silhouette -->
    <path d="M 24 102 L 136 102 L 154 126 L 136 150 L 24 150 Z" fill="#162320" stroke="#50B868" stroke-width="1.4"/>
    <line x1="40" y1="116" x2="124" y2="116" stroke="#50B868" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="40" y1="136" x2="124" y2="136" stroke="#50B868" stroke-opacity="0.55" stroke-width="2"/>
    <text x="24" y="176" fill="#C9D1D9" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Calib: DRY 2480 · WET 650</text>
    <text x="24" y="196" fill="#7D8590" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">15-sample + 3-window MA</text>

    <!-- Right-side pin terminals -->
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end">
      <text x="296" y="122" fill="#F85149">VCC (5V)</text>
      <circle cx="318" cy="118" r="5" fill="#F85149"/>

      <text x="296" y="162" fill="#C9D1D9">GND</text>
      <circle cx="318" cy="158" r="5" fill="#8B949E"/>

      <text x="296" y="202" fill="#50B868">AOUT</text>
      <circle cx="318" cy="198" r="5" fill="#50B868"/>
    </g>
  </g>

  <!-- Wires: Soil v1.2 <-> ESP32 -->
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 364 252 L 479 252" stroke="#F85149"/>
    <path d="M 364 292 L 410 292 L 410 332 L 479 332" stroke="#8B949E"/>
    <path d="M 364 332 L 392 332 L 392 372 L 479 372" stroke="#50B868"/>
  </g>

  <!-- ==================== TOP-RIGHT MODULE: BME280 ==================== -->
  <g transform="translate(836, 86)">
    <rect x="0" y="0" width="318" height="164" rx="12" fill="#101820" stroke="#A371F7" stroke-width="1.6"/>
    <text x="20" y="30" fill="#A371F7" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">ATMOSPHERE</text>
    <text x="20" y="54" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">BME280 (I2C 0x76)</text>
    <text x="20" y="76" fill="#8B949E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">Temp · Humidity · Pressure</text>
    <text x="20" y="98" fill="#7D8590" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Forced Mode · SoftI2C 50 kHz</text>

    <!-- Left-side pin terminals -->
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <circle cx="0" cy="118" r="5" fill="#50B868"/>
      <text x="14" y="122" fill="#50B868">SDA</text>

      <circle cx="0" cy="144" r="5" fill="#A371F7"/>
      <text x="14" y="148" fill="#A371F7">SCL</text>

      <text x="298" y="122" text-anchor="end" fill="#F0B429">VCC → 3V3</text>
      <text x="298" y="144" text-anchor="end" fill="#C9D1D9">GND → GND</text>
    </g>
  </g>

  <!-- Wires: BME280 <-> ESP32 -->
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 721 292 L 774 292 L 774 204 L 836 204" stroke="#50B868"/>
    <path d="M 721 332 L 792 332 L 792 230 L 836 230" stroke="#A371F7"/>
  </g>

  <!-- ==================== BOTTOM-RIGHT MODULE: RAINDROP FC-37 ==================== -->
  <g transform="translate(836, 282)">
    <rect x="0" y="0" width="318" height="172" rx="12" fill="#101820" stroke="#60C0E8" stroke-width="1.6"/>
    <text x="20" y="30" fill="#60C0E8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">HYDROSPHERE</text>
    <text x="20" y="54" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Raindrop FC-37</text>
    <text x="20" y="76" fill="#F0B429" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">STRICTLY 3V3 ONLY (Never 5V!)</text>
    <text x="20" y="98" fill="#7D8590" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Calib: DRY 4095 · WET 1200</text>

    <!-- Left-side pin terminals -->
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <circle cx="0" cy="118" r="5" fill="#60C0E8"/>
      <text x="14" y="122" fill="#60C0E8">DO (is_raining)</text>

      <circle cx="0" cy="146" r="5" fill="#60C0E8"/>
      <text x="14" y="150" fill="#60C0E8">AO → P35 (rainfall_pct)</text>

      <text x="298" y="122" text-anchor="end" fill="#F0B429">VCC → 3V3</text>
      <text x="298" y="146" text-anchor="end" fill="#C9D1D9">GND → GND</text>
    </g>
  </g>

  <!-- Wires: FC-37 <-> ESP32 -->
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 721 372 L 774 372 L 774 400 L 836 400" stroke="#60C0E8"/>
    <path d="M 479 412 L 434 412 L 434 476 L 806 476 L 806 428 L 836 428" stroke="#60C0E8" stroke-dasharray="6 4"/>
  </g>

  <!-- Footer legend -->
  <rect x="36" y="494" width="1128" height="30" rx="6" fill="#070B10" stroke="#1B222C" stroke-width="1"/>
  <text x="52" y="513" fill="#8B949E" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <tspan fill="#F85149">●</tspan> VIN 5V (Soil v1.2)   
    <tspan fill="#F0B429">●</tspan> 3V3 (BME280 &amp; FC-37)   
    <tspan fill="#50B868">●</tspan> Signal SDA / Soil ADC1   
    <tspan fill="#60C0E8">●</tspan> Rain DO &amp; AO (ADC1)   
    <tspan fill="#A371F7">●</tspan> I2C SCL
  </text>
  <text x="1148" y="513" text-anchor="end" fill="#48566A" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Verified on ESP32-D0WD-V3 · MicroPython v1.29.0</text>
</svg>
